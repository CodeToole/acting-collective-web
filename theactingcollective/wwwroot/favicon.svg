<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Background with rounded corners & gold border -->
  <rect x="8" y="8" width="240" height="240" rx="44" ry="44" fill="#0c0d0e" stroke="#c59b27" stroke-width="8"/>

  <!-- Outer glowing/accent gold frame subtle inner layer -->
  <g id="logo-graphic" transform="translate(128, 128)">
	<!-- Left solid arc of the C -->
	<path d="M -8, -68 A 68 68 0 0 0 -8, 68 A 46 46 0 0 1 -8, -68 Z" fill="#f5f5f7"/>

	<!-- Central Z symbol -->
	<text x="-4" y="16" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#f5f5f7" text-anchor="middle">Z</text>

	<!-- Pixelated / broken blocks forming the right side of the C -->
	<!-- Top arc blocks -->
	<rect x="10" y="-68" width="12" height="12" fill="#f5f5f7" transform="rotate(5, 10, -68)"/>
	<rect x="28" y="-64" width="12" height="12" fill="#f5f5f7" transform="rotate(15, 28, -64)"/>
	<rect x="44" y="-54" width="12" height="12" fill="#f5f5f7" transform="rotate(25, 44, -54)"/>
	<rect x="58" y="-38" width="12" height="12" fill="#f5f5f7" transform="rotate(35, 58, -38)"/>
	<rect x="66" y="-18" width="11" height="11" fill="#f5f5f7" transform="rotate(45, 66, -18)"/>

	<!-- Outer / scattered top blocks -->
	<rect x="22" y="-48" width="10" height="10" fill="#f5f5f7"/>
	<rect x="38" y="-36" width="10" height="10" fill="#f5f5f7"/>
	<rect x="52" y="-20" width="10" height="10" fill="#f5f5f7"/>
	<rect x="42" y="-72" width="9" height="9" fill="#f5f5f7"/>
	<rect x="62" y="-56" width="8" height="8" fill="#f5f5f7"/>
	<rect x="74" y="-36" width="9" height="9" fill="#f5f5f7"/>

	<!-- Bottom arc blocks -->
	<rect x="10" y="56" width="12" height="12" fill="#f5f5f7" transform="rotate(-5, 10, 56)"/>
	<rect x="28" y="52" width="12" height="12" fill="#f5f5f7" transform="rotate(-15, 28, 52)"/>
	<rect x="44" y="42" width="12" height="12" fill="#f5f5f7" transform="rotate(-25, 44, 42)"/>
	<rect x="58" y="26" width="12" height="12" fill="#f5f5f7" transform="rotate(-35, 58, 26)"/>
	<rect x="66" y="8" width="11" height="11" fill="#f5f5f7" transform="rotate(-45, 66, 8)"/>

	<!-- Outer / scattered bottom blocks -->
	<rect x="22" y="38" width="10" height="10" fill="#f5f5f7"/>
	<rect x="38" y="26" width="10" height="10" fill="#f5f5f7"/>
	<rect x="52" y="10" width="10" height="10" fill="#f5f5f7"/>
	<rect x="42" y="62" width="9" height="9" fill="#f5f5f7"/>
	<rect x="62" y="46" width="8" height="8" fill="#f5f5f7"/>
	<rect x="74" y="26" width="9" height="9" fill="#f5f5f7"/>
  </g>
</svg>
